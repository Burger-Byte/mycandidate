
services:
  db:
    image: postgres:15-alpine
    container_name: mycandidate_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mycandidate_za
      POSTGRES_USER: mycandidate  
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - mycandidate_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycandidate -d mycandidate_za"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: mycandidate_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - mycandidate_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: mycandidate_web
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SITE_URL: ${SITE_URL}
      PYTHONPATH: /app
      WTF_CSRF_ENABLED: ${WTF_CSRF_ENABLED:-True}
      SSL_DISABLE: ${SSL_DISABLE:-False}
      
    ports:
      - "8100:5000"
    volumes:
      - ./logs:/app/logs
      - ./instance:/app/instance
    networks:
      - mycandidate_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: mycandidate_migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PYTHONPATH: /app
    command: sh -c "alembic upgrade head && python rebuild_db.py"
    networks:
      - mycandidate_network
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: mycandidate_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - mycandidate_network
    depends_on:
      - web
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  mycandidate_network:
    driver: bridge